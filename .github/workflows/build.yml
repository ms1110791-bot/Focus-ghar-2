name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ZIP_NAME: "focusgar1.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        run: |
          echo "Files in repo:"
          ls -la
          ZIP=""
          if [ -f "$ZIP_NAME" ]; then
            ZIP="$ZIP_NAME"
          else
            ZIP=$(find . -maxdepth 3 -iname '*.zip' | head -n 1)
          fi
          SRC=.
          if [ -n "$ZIP" ]; then
            echo "Unzipping: $ZIP"
            mkdir -p project
            unzip -q -o "$ZIP" -d project
            SRC=project
          else
            echo "No zip found, using repo files directly"
          fi
          FILE=$(find "$SRC" -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found. Upload the zip to the repo root."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusGhar-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
